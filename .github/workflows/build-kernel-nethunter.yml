name: Build NetHunter kernel (6.6 TigerKitty)

# Builds the TigerKitty 6.6.143 GKI kernel from the SAME source and the SAME
# device.config as the kernel that is running on the phone (confirmed identical
# to the kernel inside the crDroid 12.12 payload.bin), with a MINIMAL delta:
#
#   + CONFIG_USB_CONFIGFS_RNDIS     -> NetHunter "USB Arsenal" network (Windows)
#   + CONFIG_USB_CONFIGFS_F_PRINTER -> USB printer emulation
#   + CONFIG_USB_IPHETH / RNDIS_HOST (modules) -> tethering from other phones
#   + CONFIG_BT_HCIBTUSB / BT_HCIVHCI (modules) -> external BT dongles + VHCI
#   + CONFIG_USB_SERIAL_{CP210X,PL2303,CH341,OPTION,GENERIC,SIMPLE} -> USB-TTL
#     adapters (Arduino / ESP32 / 4G modems); none of these exist in /vendor
#   + CONFIG_SQUASHFS (XZ/LZ4/ZSTD)  -> Kali chroot images
#   + CONFIG_NF_TABLES + NFT_*       -> modern nftables firewall rules
#
# Everything else (cfg80211, mac80211, MTK wifi, USB gadget) is left exactly
# as in the running kernel, so the vendor modules keep loading unchanged and
# the boot risk stays minimal.
#
# Output artifact:
#   Image.gz / Image   -> drop-in kernel replacement
#   meta/config, meta/System.map, meta/build-info.txt
#
# Flashing is NOT done here: boot.img is repacked on the phone with magiskboot
# so the Magisk ramdisk is preserved.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "kernel branch / tag"
        type: string
        default: "main"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install LLVM and build deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates wget gnupg bc bison flex libssl-dev libelf-dev \
            python3 rsync cpio zip unzip xz-utils kmod dwarves

          # The stock TigerKitty kernel was built with LLVM 19 (Debian clang 19.1.7),
          # so we use LLVM 19 as well: CFI type hashes stay in the same family and
          # the vendor modules keep loading.  The LLVM apt key has been removed
          # from the mirror, hence [trusted=yes].
          echo "deb [trusted=yes] http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | \
            sudo tee /etc/apt/sources.list.d/llvm19.list > /dev/null
          sudo apt-get update -qq || true

          FLAG=-19
          if ! sudo apt-get install -y --no-install-recommends clang-19 lld-19 llvm-19; then
            echo "::warning::clang-19 unavailable - falling back to clang-18"
            sudo rm -f /etc/apt/sources.list.d/llvm19.list
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
            FLAG=-18
          fi
          echo "LLVM_FLAG=$FLAG" >> "$GITHUB_ENV"
          "clang$FLAG" --version | head -2
          "ld.lld$FLAG" --version | head -1

      - name: Clone kernel source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.kernel_ref }}" \
            https://github.com/lvd3767/android_kernel_xiaomi_fire_gki6.6-tigerkitty.git kernel
          cd kernel
          git log --oneline -1
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile

      - name: Config (device config + NetHunter gadget functions)
        run: |
          set -euo pipefail
          cd kernel
          cp ../device.config .config

          # --- reproduce the running kernel's UTS_RELEASE byte for byte ---
          ./scripts/config --file .config --set-str LOCALVERSION \
            "-TigerKitty-by-B055nian-g93bbc15e5f81-dirty"
          ./scripts/config --file .config --disable LOCALVERSION_AUTO
          : > .scmversion

          # --- the only additions (gadgets) ---
          ./scripts/config --file .config --enable  USB_CONFIGFS_RNDIS
          ./scripts/config --file .config --enable  USB_CONFIGFS_F_PRINTER
          ./scripts/config --file .config --module  USB_IPHETH
          ./scripts/config --file .config --module  USB_NET_RNDIS_HOST

          # --- round 2: BT USB dongles, USB-serial adapters, nftables, squashfs ---
          # CONFIG_BT is already =m in device.config, so the BT drivers stay modules.
          ./scripts/config --file .config --module  BT_HCIBTUSB
          ./scripts/config --file .config --module  BT_HCIVHCI

          # USB-serial: /vendor/lib/modules has NO serial driver at all today,
          # so every adapter except FTDI/CDC-ACM is dead on this device.
          ./scripts/config --file .config --module  USB_SERIAL_CP210X
          ./scripts/config --file .config --module  USB_SERIAL_PL2303
          ./scripts/config --file .config --module  USB_SERIAL_CH341
          ./scripts/config --file .config --module  USB_SERIAL_OPTION
          ./scripts/config --file .config --module  USB_SERIAL_SIMPLE
          ./scripts/config --file .config --enable  USB_SERIAL_GENERIC

          # squashfs: Kali/NetHunter chroot images (CONFIG_XZ_DEC is already =y)
          ./scripts/config --file .config --enable  SQUASHFS
          ./scripts/config --file .config --enable  SQUASHFS_XZ
          ./scripts/config --file .config --enable  SQUASHFS_LZ4
          ./scripts/config --file .config --enable  SQUASHFS_ZSTD

          # nftables: the ROM only ships the legacy iptables stack
          ./scripts/config --file .config --enable  NF_TABLES
          ./scripts/config --file .config --enable  NF_TABLES_INET
          ./scripts/config --file .config --enable  NF_TABLES_IPV4
          ./scripts/config --file .config --enable  NF_TABLES_IPV6
          ./scripts/config --file .config --enable  NF_TABLES_NETDEV
          ./scripts/config --file .config --enable  NFT_COMPAT
          ./scripts/config --file .config --enable  NFT_CT
          ./scripts/config --file .config --enable  NFT_NAT
          ./scripts/config --file .config --enable  NFT_MASQ
          ./scripts/config --file .config --enable  NFT_REDIR
          ./scripts/config --file .config --enable  NFT_LOG
          ./scripts/config --file .config --enable  NFT_REJECT
          ./scripts/config --file .config --enable  NFT_COUNTER
          ./scripts/config --file .config --enable  NFT_LIMIT
          ./scripts/config --file .config --enable  NFT_QUOTA
          ./scripts/config --file .config --enable  NFT_HASH
          ./scripts/config --file .config --enable  NFT_FIB
          ./scripts/config --file .config --enable  NFT_SOCKET
          ./scripts/config --file .config --enable  NFT_TPROXY

          make ARCH=arm64 LLVM=${{ env.LLVM_FLAG }} olddefconfig

          echo "=== delta (must be set) ==="
          grep -E '^(CONFIG_USB_CONFIGFS_RNDIS=|CONFIG_USB_F_RNDIS=|CONFIG_USB_CONFIGFS_F_PRINTER=|CONFIG_USB_F_PRINTER=|CONFIG_USB_IPHETH=|CONFIG_USB_NET_RNDIS_HOST=)' .config
          if grep -qE '^# CONFIG_USB_(CONFIGFS_RNDIS|CONFIGFS_F_PRINTER) is not set' .config; then
            echo "::error::NetHunter gadget option got dropped by olddefconfig"
            exit 1
          fi

          echo "=== round-2 delta (must be set) ==="
          grep -E '^(CONFIG_BT_HCIBTUSB=|CONFIG_BT_HCIVHCI=|CONFIG_USB_SERIAL_(CP210X|PL2303|CH341|OPTION|SIMPLE|GENERIC)=|CONFIG_(SQUASHFS|SQUASHFS_XZ|SQUASHFS_LZ4|NF_TABLES|NF_TABLES_INET|NFT_CT|NFT_NAT|NFT_MASQ)=)' .config || true
          for o in BT_HCIBTUSB BT_HCIVHCI USB_SERIAL_CP210X USB_SERIAL_PL2303 \
                   USB_SERIAL_CH341 USB_SERIAL_OPTION SQUASHFS NF_TABLES NFT_CT NFT_NAT; do
            grep -qE "^CONFIG_${o}=[my]$" .config || {
              echo "::error::CONFIG_${o} got dropped by olddefconfig (dependency missing)"
              exit 1
            }
          done
          echo "=== untouched (must still match the running kernel) ==="
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_CFI_CLANG=|CONFIG_USB_CONFIGFS_F_HID=|CONFIG_USB_F_HID=|CONFIG_USB_CONFIGFS_F_FS=|CONFIG_MODULES=|CONFIG_MODVERSIONS=|# CONFIG_CFG80211)' .config || true

      - name: Build Image
        run: |
          set -euo pipefail
          cd kernel
          make ARCH=arm64 LLVM=${{ env.LLVM_FLAG }} -j"$(nproc)" Image
          gzip -9 -c arch/arm64/boot/Image > arch/arm64/boot/Image.gz
          ls -l arch/arm64/boot/Image arch/arm64/boot/Image.gz
          echo "=== release string inside the image ==="
          strings arch/arm64/boot/Image | grep -m3 -E '6\.6\.143.*TigerKitty' || true

      - name: Build helper modules (RNDIS/iPhone tethering, USB serial, BT USB)
        env:
          KBUILD_MODPOST_WARN: "1"
        run: |
          set -uo pipefail
          cd kernel
          make ARCH=arm64 LLVM=${{ env.LLVM_FLAG }} -j"$(nproc)" modules_prepare
          # Only the directories we actually need (a full `make modules` would take
          # far longer and would trip over MTK's out-of-tree vendor drivers).
          for d in drivers/net/usb drivers/usb/serial drivers/bluetooth; do
            echo "=== M=$d ==="
            make ARCH=arm64 LLVM=${{ env.LLVM_FLAG }} -j"$(nproc)" M="$d" modules 2>&1 | tail -15 || true
            find "$d" -name '*.ko' | sort
          done
          echo "=== required modules present? ==="
          for k in drivers/usb/serial/usbserial.ko drivers/usb/serial/ch341.ko \
                   drivers/usb/serial/cp210x.ko drivers/usb/serial/pl2303.ko \
                   drivers/bluetooth/btusb.ko drivers/bluetooth/hci_vhci.ko; do
            [ -f "$k" ] && echo "OK   $k" || echo "::warning::missing $k"
          done

      - name: Verify and collect
        run: |
          set -euo pipefail
          cd kernel
          OUT="$GITHUB_WORKSPACE/out"; mkdir -p "$OUT/meta" "$OUT/modules"
          cp arch/arm64/boot/Image.gz "$OUT/"
          cp arch/arm64/boot/Image    "$OUT/"
          cp .config                  "$OUT/meta/config"
          cp System.map               "$OUT/meta/System.map"
          for d in drivers/net/usb drivers/usb/serial drivers/bluetooth; do
            find "$d" -name '*.ko' -exec cp {} "$OUT/modules/" \;
          done
          {
            echo "source: $(git rev-parse --short HEAD)"
            echo "clang:  $(clang-19 --version | head -1)"
            echo "image:  $(stat -c %s arch/arm64/boot/Image) bytes raw / $(stat -c %s arch/arm64/boot/Image.gz) bytes gzip"
            echo "uname:  $(strings arch/arm64/boot/Image | grep -m1 -E '^6\.6\.143')"
          } > "$OUT/meta/build-info.txt"
          cat "$OUT/meta/build-info.txt"
          echo "--- modules ---"
          for f in "$OUT"/modules/*.ko; do printf '%-22s %s\n' "$(basename "$f")" "$(modinfo -F vermagic "$f")"; done
          echo "--- size guard (boot partition is 128 MiB) ---"
          [ "$(stat -c %s arch/arm64/boot/Image.gz)" -lt 60000000 ] || { echo "::error::kernel too big"; exit 1; }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
